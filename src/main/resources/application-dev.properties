# Profil de developpement
spring.application.name=Autoloc

# Port specifique
server.port=${PORT:8082}

# Base H2 en memoire (permet de tester sans serveur MySQL actif)
spring.datasource.url=jdbc:h2:mem:autoloc_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs plus verbeux en developpement
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=DEBUG

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
