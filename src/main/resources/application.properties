spring.application.name=Autoloc

# Port du serveur (8081 par défaut, évite le conflit avec Oracle XE sur 8080)
server.port=${PORT:8082}

# Connexion à la base de données
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/autoloc_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

